name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            label: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Installed Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'gpt-Switch-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Get-ChildItem $installDir -Filter 'gpt-switch.exe' -Recurse | Select-Object -First 1
          if (!$exe) { throw 'Installed executable missing' }
          $notice = Get-Content (Join-Path $installDir 'THIRD_PARTY_NOTICES.md') -Raw
          if (!$notice.Contains('Copyright (c) 2025 Jason Young')) { throw 'Third-party notice missing' }
          $report = Join-Path $env:RUNNER_TEMP 'gpt-switch-smoke.json'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--smoke-test', $report) -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke timed out' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.ok -or !$result.webview -or !$result.tray -or !$result.gateway -or !$result.safeExit -or $result.revision -ne $env:GITHUB_SHA) { throw 'Smoke failed' }
          Get-Content $report
      - name: Installed macOS DMG smoke test
        if: runner.os == 'macOS'
        shell: bash
        run: |
          report="$RUNNER_TEMP/gpt-switch-smoke.json"
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/gpt-switch-volume"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          ditto "$mount/gpt-Switch.app" "$RUNNER_TEMP/gpt-Switch.app"
          hdiutil detach "$mount"
          executable="$RUNNER_TEMP/gpt-Switch.app/Contents/MacOS/gpt-switch"
          test -x "$executable"
          python3 -c 'import pathlib,sys; assert "Copyright (c) 2025 Jason Young" in pathlib.Path(sys.argv[1]).read_text()' "$RUNNER_TEMP/gpt-Switch.app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          "$executable" --smoke-test "$report" &
          pid=$!
          for attempt in {1..60}; do
            if [ -f "$report" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -f "$report" ]; then kill "$pid" 2>/dev/null || true; exit 1; fi
          wait "$pid"
          python3 -c 'import json,sys,os; d=json.load(open(sys.argv[1])); assert d["ok"] and d["webview"] and d["tray"] and d["gateway"] and d["safeExit"] and d["revision"] == os.environ["GITHUB_SHA"]; print(d)' "$report"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Package icon sources and checksums
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          zip -r release-assets/gpt-Switch-icons.zip assets src-tauri/icons
          cd release-assets
          sha256sum *.dmg *.exe *.zip > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "gpt-Switch $GITHUB_REF_NAME" --notes-file RELEASE.md
