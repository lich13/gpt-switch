[package]
name = "gpt-switch"
version = "0.1.0"
description = "Lightweight Codex account switcher and TOML editor"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "gpt_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
toml = "0.9"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
open = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }
winreg = "0.55"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"

[profile.release.build-override]
strip = "none"
